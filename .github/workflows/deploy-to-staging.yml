      - name: Build data
        run: |
          python scripts/build_data.py

      - name: Place public files
        run: |
          cp public/robots-staging.txt _site/robots.txt

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: _site
          CLEAN: true

      - name: Waiting 4 minutes for staging data deployment
        run: |
          sleep 240

      - name: Rebuild site
        run: |
          curl -X POST https://api.github.com/repos/hagstovan/sdg-site/dispatches \
            -H "Accept: application/vnd.github.everest-preview+json" \
            -H "Authorization: token ${{ secrets.token }}" \
            --data '{"event_type":"rebuild-staging"}'
